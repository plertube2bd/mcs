plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.149'
}

base { archivesName = 'mcs-neoforge' }
group = 'mcs.runtime'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.java.srcDir '../common/src/main/java'

neoForge {
    version = project.neo_version
    mods { mcs { sourceSet(sourceSets.main) } }
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': version }
}
